name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    # 🔑 Garante permissões totais para ler a API e escrever no repositório
    permissions: write-all
    
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Gera o gráfico de contribuição 3D (Tema Escuro/Night)
      - name: Generate 3D contribution chart
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PabliitoxD

      # 3. Gera os cards de estatísticas (Tokyo Night)
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: PabliitoxD
          theme: tokyonight

      # 4. Limpa e organiza tudo na pasta 'dist' para o deploy sem conflito de commits
      - name: Prepare assets for deploy
        run: |
          mkdir -p dist
          cp -r profile-3d-contrib/* dist/ || true
          mkdir -p dist/github-stats
          cp -r profile-summary-card-output/tokyonight/* dist/github-stats/ || true

      # 5. Salva na branch 'output'
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
