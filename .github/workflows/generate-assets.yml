name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Gera o gráfico de contribuição 3D (incluindo o tema dark/night)
      - name: Generate 3D contribution chart
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PabliitoxD

      # 3. Gera os cards de estatísticas no tema Tokyo Night localmente
      - name: Generate profile summary cards
        uses: vn7n24f1tr1/github-profile-summary-cards@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: PabliitoxD
          theme: tokyonight

      # 4. Organiza os arquivos gerados na pasta 'dist' para o deploy
      - name: Prepare assets for deploy
        run: |
          mkdir -p dist
          # Copia os gráficos 3D (incluindo a versão escurecida 'profile-night-view.svg')
          cp -r profile-3d-contrib/* dist/ || true
          # Copia as estatísticas geradas no tema tokyonight para dist/github-stats
          mkdir -p dist/github-stats
          cp -r profile-summary-card-output/tokyonight/* dist/github-stats/ || true

      # 5. Faz o deploy dos arquivos da pasta 'dist' para a branch 'output'
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
